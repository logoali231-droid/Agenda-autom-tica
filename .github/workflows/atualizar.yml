name: Atualizar Notas PUCPR

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar atualizacao
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          python atualizar_notas.py

      - name: Salvar atualizacoes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Guarda os arquivos gerados pelo Python
          cp Painel_Academico_PUCPR.xlsx /tmp/Painel_Academico_PUCPR.xlsx
          cp historico_atividades.json /tmp/historico_atividades.json 2>/dev/null || true

          # Busca a versão mais recente do repositório
          git fetch origin main

          # Volta para o estado mais recente do GitHub
          git reset --hard origin/main

          # Recoloca os arquivos gerados nesta execução
          cp /tmp/Painel_Academico_PUCPR.xlsx Painel_Academico_PUCPR.xlsx

          if [ -f /tmp/historico_atividades.json ]; then
            cp /tmp/historico_atividades.json historico_atividades.json
          fi

          # Remove arquivos Python compilados
          rm -rf __pycache__

          # Adiciona somente os arquivos que realmente queremos versionar
          git add Painel_Academico_PUCPR.xlsx
          git add historico_atividades.json 2>/dev/null || true

          # Verifica se houve alteração
          if git diff --cached --quiet; then
            echo "Sem alteracoes."
            exit 0
          fi

          git commit -m "Atualizacao automatica"

          git push origin main
